[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = --verbose --tb=short --html=reports/report.html --self-contained-html
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    scenario1: Authentication Token Scenario
    scenario2: Get Checklist Items Scenario
    scenario3: Update Article Scenario
    scenario4: Get All Articles Scenario
    scenario5: Get All Articles Sorted by Store Rank Ascending Scenario
    testscenario2: Get Checklist Items Scenario (alias)
    testscenario3: Update Article Scenario (alias)
